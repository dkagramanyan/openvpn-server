# OpenVPN server configuration (OpenVPN 2.7).
# Paths are relative to /etc/openvpn (the container runs OpenVPN with --cd).

# Management interface. Don't change the address/port: the web UI shares this
# container's network namespace and talks to 127.0.0.1:2080. The password
# file is generated on first start by the entrypoint.
management 127.0.0.1 2080 /etc/openvpn/config/management.pw

dev tun
# Listening sockets: UDP (fast, preferred) and TCP (fallback for networks
# that block UDP) at the same time - OpenVPN 2.7 multi-socket. With host
# networking they are bound straight on the host, so they must match your
# router's port forwards. Client profiles list both, UDP first.
proto udp
local * 1197 udp
local * 1196 tcp

topology subnet
# One certificate may be used on several devices at the same time.
duplicate-cn
keepalive 10 60
max-clients 100

# persist-key is a no-op since OpenVPN 2.7 (keys are always persisted).
persist-tun

user nobody
group nogroup

# Addresses per device: guests (guests/<name>) get a free guest address,
# static IPs (staticclients/<name>) go to the first device that connects.
client-connect /opt/app/bin/client-access.sh
client-disconnect /opt/app/bin/client-access.sh

# ---- PKI ------------------------------------------------------------------
ca pki/ca.crt
cert pki/issued/server.crt
key pki/private/server.key
crl-verify pki/crl.pem
# ECDH is used for key exchange; no DH parameters file needed (2.7 default).
dh none

# ---- Control channel ------------------------------------------------------
tls-crypt pki/ta.key
tls-version-min 1.2
tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
tls-cipher TLS-ECDHE-ECDSA-WITH-AES-256-GCM-SHA384:TLS-ECDHE-RSA-WITH-AES-256-GCM-SHA384:TLS-ECDHE-ECDSA-WITH-CHACHA20-POLY1305-SHA256:TLS-ECDHE-RSA-WITH-CHACHA20-POLY1305-SHA256
tls-cert-profile preferred
remote-cert-tls client

# ---- Data channel ---------------------------------------------------------
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
data-ciphers-fallback AES-256-GCM
auth SHA512

# ---- Tuning ---------------------------------------------------------------
# MTU: tun-mtu 1500 and "mssfix 1492 mtu" are the OpenVPN 2.7 defaults. With
# kernel offload (DCO) the data packets never pass through OpenVPN, so mssfix
# does nothing on this side; the container clamps the TCP MSS in its firewall
# instead (OVPN_MSS, default 1400 - the value mssfix 1492 gives). Lower
# OVPN_MSS if large transfers stall on some network.
sndbuf 0
rcvbuf 0
push "sndbuf 0"
push "rcvbuf 0"
# Tells UDP clients when the server goes down so they reconnect at once
# (TCP clients notice by themselves).
explicit-exit-notify 1

# ---- Addressing and routes ------------------------------------------------
# One tunnel subnet: with "topology subnet" OpenVPN only accepts addresses
# inside it. 10.0.70.2-99 is the dynamic pool, 10.0.70.100-127 is for static
# IPs, and 10.0.70.128/25 (GUEST_SUB) for guests: internet and DNS only.
server 10.0.70.0 255.255.255.0 nopool
ifconfig-pool 10.0.70.2 10.0.70.99
push "route 10.0.60.0 255.255.255.0"     # Route to Home VPN subnet
# DNS server for VPN clients: "dns" for OpenVPN 2.6+ and Connect 3, and
# "dhcp-option" for older clients.
# 170.134.51.1 answers the home domains with LAN addresses (split DNS), so
# clients reach home services directly instead of through the public IP.
push "dns server 0 address 170.134.51.1"
push "dhcp-option DNS 170.134.51.1"
# All IPv4 through the tunnel. IPv6 is routed into the tunnel too, so it
# cannot leak around it, and answered there with "no route" (block-ipv6 on
# both ends): the private range below exists only for that.
ifconfig-ipv6 fd00:70::1/64 fd00:70::2
ifconfig-ipv6-pool fd00:70::1000/64
block-ipv6
push "redirect-gateway def1 ipv6 bypass-dhcp"
push "block-ipv6"
push "route 171.134.51.0 255.255.255.0"  # as on the old server
push "block-outside-dns"                 # Windows clients: prevent DNS leaks

# ---- Logging --------------------------------------------------------------
log-append /var/log/openvpn/openvpn.log
verb 3
# The web UI reads the client list from this file (a "status" command on the
# management interface would be logged every time it polls).
status /var/log/openvpn/openvpn-status.log 5
status-version 3

# ---- Two-factor authentication (TOTP) ------------------------------------
# Enable from the web UI (Server > Two-factor authentication) or uncomment:
#auth-user-pass-verify /opt/app/bin/oath.sh via-file
#auth-gen-token 43200
