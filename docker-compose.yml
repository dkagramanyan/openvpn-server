x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  apple-relay:
    image: openvpn-apple-relay:local
    build: { context: ., dockerfile: relay/Dockerfile }
    network_mode: host
    depends_on:
      relay-policy: {condition: service_healthy}
    environment:
      # HTTP/2 always serves (through the gateway); HTTP/3 starts by itself
      # once relay-tls/ holds the certificate. Old values http2 / http3 still work.
      RELAY_TRANSPORT: ${APPLE_RELAY_TRANSPORT:-http2+http3}
      RELAY_HTTP2_BIND: ${APPLE_RELAY_HTTP2_BIND:-:8444}
      RELAY_TRUSTED_PROXIES: ${APPLE_RELAY_TRUSTED_PROXIES:-127.0.0.1/32 ::1/128}
      RELAY_BIND: ${APPLE_RELAY_BIND:-:8443}
      # HTTP/2 straight from the devices over TLS (TCP of the same port as HTTP/3's
      # UDP), with the certificate in relay-tls/. "off": HTTP/2 only through the gateway.
      RELAY_HTTP2_TLS_BIND: ${APPLE_RELAY_HTTP2_TLS_BIND:-:8443}
      RELAY_MAX_FLOWS: ${APPLE_RELAY_MAX_FLOWS:-2048}
      RELAY_MAX_FLOWS_PER_CLIENT: ${APPLE_RELAY_MAX_FLOWS_PER_CLIENT:-512}
      RELAY_MAX_AUTH_CHECKS: ${APPLE_RELAY_MAX_AUTH_CHECKS:-64}
      RELAY_MAX_H2_CONNECTIONS: ${APPLE_RELAY_MAX_H2_CONNECTIONS:-128}
      RELAY_H2_READ_IDLE: ${APPLE_RELAY_H2_READ_IDLE:-10s}
      RELAY_H2_PING_TIMEOUT: ${APPLE_RELAY_H2_PING_TIMEOUT:-5s}
      RELAY_MAX_H2_STREAMS: ${APPLE_RELAY_MAX_H2_STREAMS:-512}
      # Networks that take TCP but drop UDP (the router's FakeIP range): UDP to them is
      # refused at once so apps use TCP. "off" refuses none.
      RELAY_UDP_REFUSED: ${APPLE_RELAY_UDP_REFUSED:-198.18.0.0/15}
      RELAY_NETWORK_CONFIG: /etc/relay-network/proxies.conf
      RELAY_AUTH_URL: ${APPLE_RELAY_AUTH_URL:-http://127.0.0.1:8447/api/relay/authorize}
    # The certificate for HTTP/3 and direct HTTP/2 (relay-cert keeps it renewed).
    volumes:
      - ${APPLE_RELAY_TLS_DIR:-./relay-tls}:/tls:ro
      - ./config/network:/etc/relay-network:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    logging: *logging
    restart: unless-stopped

  # The relay's certificate from Let's Encrypt, DNS challenge with the provider's
  # service account (as the gateway's Traefik does), renewed when due. Idle until
  # RELAY_CERT_DOMAIN and ACME_EMAIL are set in .env.
  relay-cert:
    image: goacme/lego:v5.6.0
    entrypoint: [/bin/sh, /app/relay-cert.sh]
    network_mode: host
    environment:
      RELAY_CERT_DOMAIN: ${RELAY_CERT_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_DNS_PROVIDER: ${ACME_DNS_PROVIDER:-selectelv2}
      ACME_DNS_RESOLVERS: ${ACME_DNS_RESOLVERS:-1.1.1.1:53,8.8.8.8:53}
      ACME_DNS_WAIT: ${ACME_DNS_WAIT:-120s}
      ACME_CA_SERVER: ${ACME_CA_SERVER:-}
      SELECTELV2_ACCOUNT_ID: ${SELECTELV2_ACCOUNT_ID:-}
      SELECTELV2_PROJECT_ID: ${SELECTELV2_PROJECT_ID:-}
      SELECTELV2_USERNAME: ${SELECTELV2_USERNAME:-}
      SELECTELV2_PASSWORD: ${SELECTELV2_PASSWORD:-}
    volumes:
      - ./bin/relay-cert.sh:/app/relay-cert.sh:ro
      - ./config/acme:/data
      - ${APPLE_RELAY_TLS_DIR:-./relay-tls}:/tls
    cap_drop: [ALL]
    # write into relay-tls/ whoever owns it, and hand the files to the relay's user
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    logging: *logging
    restart: unless-stopped

  openvpn:
    container_name: openvpn
    image: openvpn-server:local
    build: .
    # Host networking: OpenVPN binds the "port" from server.conf directly on the
    # host, sees the real client addresses, and creates tun0 plus its iptables
    # rules in the host's network namespace.
    network_mode: host
    # NET_ADMIN (tun device, routes, iptables) and the tun device are all the
    # container needs - it does not run privileged. IPv4 forwarding cannot be
    # set per container in host network mode, so it has to be on for the host
    # (the Docker daemon normally enables it): sysctl -w net.ipv4.ip_forward=1
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    security_opt: [no-new-privileges:true]
    environment:
      # Network policy is saved privately through the admin UI.
      OVPN_STRICT_FORWARD: ${OVPN_STRICT_FORWARD:-1}
      OVPN_MSS: ${OVPN_MSS:-1320}                       # TCP MSS clamp for tunnel traffic (kernel offload has no mssfix); 0 = off
      OVPN_TCP_CONGESTION: ${OVPN_TCP_CONGESTION-bbr}   # TCP congestion control asked of the host; empty = leave the host's
      # OVPN_EGRESS_IFACE: eth0     # auto-detected from the default route
      # OVPN_STRICT_FORWARD: "1"    # set to 0 to allow unsolicited inbound to VPN clients
      # OVPN_MAX_DEVICES: "10"      # connections one certificate may have at a time; 0 = no limit
    volumes:
      - ./:/etc/openvpn
      - ./log:/var/log/openvpn
    logging: *logging
    restart: unless-stopped

  openvpn-ui:
    container_name: openvpn-ui
    image: openvpn-ui:local
    # The UI image copies bin/ and ui/ from the repository root.
    build: { context: ., dockerfile: ui/Dockerfile }
    # Also on the host network: OpenVPN's management interface listens on
    # 127.0.0.1:2080 there.
    network_mode: host
    depends_on:
      openvpn: {condition: service_started}
      postgres: {condition: service_healthy}
    environment:
      PGHOST: 127.0.0.1
      PGPORT: ${OPENVPN_DB_PORT:-5433}
      PGDATABASE: openvpn
      PGUSER: openvpn
      PGPASSWORD: ${OPENVPN_DB_PASSWORD:?Run python3 bin/setup-env.py}
      OPENVPN_ADMIN_USERNAME: ${OPENVPN_ADMIN_USERNAME:-admin}
      OPENVPN_ADMIN_PASSWORD: ${OPENVPN_ADMIN_PASSWORD:-}   # empty = random, printed once in the logs
      OVPN_PUBLIC_HOST: ${OVPN_PUBLIC_HOST:-}               # public address written into client profiles
      OVPN_UI_SECURE_COOKIES: ${OVPN_UI_SECURE_COOKIES:-auto} # "true" when served behind an HTTPS reverse proxy
      UVICORN_HOST: ${OVPN_UI_BIND:-0.0.0.0}                # address the UI listens on (port 8080)
      FORWARDED_ALLOW_IPS: ${OVPN_UI_TRUSTED_PROXIES:-127.0.0.1} # proxies whose X-Forwarded-For is believed
      OVPN_PROFILE_BASE_URL: ${OVPN_PROFILE_BASE_URL:-}     # public base of one-time profile links (/p/...)
      OVPN_BACKUP_RECIPIENT: ${OVPN_BACKUP_RECIPIENT:-}     # age public key: backup archives are encrypted to it
      OVPN_RELAY_TRANSPORT: ${APPLE_RELAY_TRANSPORT:-http2+http3}
      OVPN_RELAY_REQUIRE_SIGNED: ${OVPN_RELAY_REQUIRE_SIGNED:-true}
      OVPN_RELAY_SIGNER_URL: ${OVPN_RELAY_SIGNER_URL:-}
      RELAY_PROFILE_SIGNING_TOKEN: ${RELAY_PROFILE_SIGNING_TOKEN:-}
      # OVPN_BACKUP_KEEP: "14"      # daily backup archives to keep in ./backups; 0 = no backups
    volumes:
      - ./:/etc/openvpn
      - ./log:/var/log/openvpn:ro
      # - /mnt/nas/openvpn-backups:/etc/openvpn/backups   # keep the archives on another machine
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    logging: *logging
    restart: unless-stopped

  # Independent evaluator: UI maintenance is not part of the relay data path.
  relay-policy:
    image: openvpn-ui:local
    build: {context: ., dockerfile: ui/Dockerfile}
    command: [python, -m, app.policy_server]
    network_mode: host
    depends_on:
      openvpn-ui: {condition: service_healthy}
    environment:
      OPENVPN_DIR: /etc/openvpn
      PGHOST: 127.0.0.1
      PGPORT: ${OPENVPN_DB_PORT:-5433}
      PGDATABASE: openvpn
      PGUSER: relay_policy
      PGPASSWORD: ${RELAY_POLICY_DB_PASSWORD:?Run python3 bin/setup-env.py}
    volumes:
      - ./pki:/etc/openvpn/pki:ro
      - ./guests:/etc/openvpn/guests:ro
      - ./config/network:/etc/openvpn/config/network:ro
    # Private CA/client key areas are hidden; only public identity state is used.
    tmpfs:
      - /tmp
      - /etc/openvpn/pki/private:size=64k,mode=0700
      - /etc/openvpn/pki/renewed:size=64k,mode=0700
      - /etc/openvpn/pki/revoked:size=64k,mode=0700
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    read_only: true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8447/healthz',timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *logging
    restart: unless-stopped

  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: openvpn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 bin/setup-env.py}
      OPENVPN_DB_PASSWORD: ${OPENVPN_DB_PASSWORD:?Run python3 bin/setup-env.py}
      RELAY_POLICY_DB_PASSWORD: ${RELAY_POLICY_DB_PASSWORD:?Run python3 bin/setup-env.py}
    ports: ["127.0.0.1:${OPENVPN_DB_PORT:-5433}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d openvpn"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    restart: unless-stopped

volumes:
  postgres-data:
