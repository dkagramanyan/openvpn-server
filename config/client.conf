client
dev tun
remote 127.0.0.1 1197 udp
remote 127.0.0.1 1196 tcp
# Give up on a remote after 10 s (default 120 s) so the TCP fallback is quick.
server-poll-timeout 10
resolv-retry infinite
nobind
persist-tun
remote-cert-tls server
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
auth SHA512
auth-nocache
tls-version-min 1.2
verb 3
