# Copy into Traefik's dynamic configuration directory on the Raspberry Pi.
# Add an apple-relay TCP entryPoint at :8443 in static traefik.yml and publish
# 8443:8443/tcp if Traefik uses Docker bridge networking. Recreate Traefik.
# Its existing certificate store supplies the certificate for dgkagramanyan.ru.
# TLS ends here; the backend accepts cleartext HTTP/2 only from trusted proxies.
tcp:
  routers:
    apple-relay:
      entryPoints: [apple-relay]
      rule: "HostSNI(`dgkagramanyan.ru`)"
      service: apple-relay
      tls:
        options: apple-relay-http2
  services:
    apple-relay:
      loadBalancer:
        servers:
          - address: "170.134.51.30:8444"
tls:
  options:
    apple-relay-http2:
      minVersion: VersionTLS12
      alpnProtocols: [h2]
