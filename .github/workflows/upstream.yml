name: Upstream releases

on:
  schedule:
    - cron: "17 5 * * 1"      # Mondays
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: .github/scripts/upstream.sh
        env:
          GH_TOKEN: ${{ github.token }}
