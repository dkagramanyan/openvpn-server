name: CI

on:
  push:
  pull_request:

jobs:
  relay:
    runs-on: ubuntu-latest
    env:
      GODEBUG: http2xconnect=1
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install Traefik for TLS termination tests
        run: |
          mkdir -p "$RUNNER_TEMP/relay-traefik"
          curl -fsSL --retry 3 https://github.com/traefik/traefik/releases/download/v3.7.15/traefik_v3.7.15_linux_amd64.tar.gz -o "$RUNNER_TEMP/relay-traefik/traefik.tar.gz"
          printf '%s  %s\n' 5b9f51199fcb7a3b5f7ae0f9dae8dcf01efadafd92c5fca96ea2822eca81f8e6 "$RUNNER_TEMP/relay-traefik/traefik.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/relay-traefik/traefik.tar.gz" -C "$RUNNER_TEMP/relay-traefik" traefik
          echo "TRAEFIK_BIN=$RUNNER_TEMP/relay-traefik/traefik" >> "$GITHUB_ENV"
      - run: go test -race ./...
      - run: go vet ./...
      - run: docker build -f Dockerfile -t openvpn-apple-relay:ci ..

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python tests/run-ui.py

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo unshare --net env GUEST_PORTAL_NETNS_TEST=1 bash tests/guest-portal-network.sh
      - run: tests/e2e/run.sh

  relay-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r ui/requirements.txt
      - run: pip install pytest httpx
      - run: python -m pytest tests/test_guest_portal_firewall.py -q
      - run: docker build -f signer/Dockerfile -t openvpn-profile-signer:relay-test .
      - run: docker build -f relay/Dockerfile -t openvpn-apple-relay:relay-test .
      - run: docker build -f ui/Dockerfile -t openvpn-ui:relay-test .
      - run: python tests/relay-stack.py
