name: CI

on:
  push:
  pull_request:

jobs:
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: docker build -f Dockerfile -t openvpn-apple-relay:ci ..

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r ui/requirements.txt
      - run: pip install pytest httpx
      - run: python -m pytest ui/tests -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tests/e2e/run.sh
