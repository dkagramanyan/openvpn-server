services:
  openvpn:
    container_name: openvpn
    image: openvpn-server:local
    build: .
    # Host networking: the VPN port is the "port" from server.conf, bound
    # directly on the host. IPv4 forwarding must be enabled on the host.
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    environment:
      TRUST_SUB: "10.0.70.0/24"
      GUEST_SUB: "10.0.71.0/24"
      HOME_SUB: "192.168.88.0/24"
    volumes:
      - ./:/etc/openvpn
      - ./log:/var/log/openvpn
    restart: unless-stopped
